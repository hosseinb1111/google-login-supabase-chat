<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Free & Complicated Messenger 😉✌️ — Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --bg: #0b0c0f;
      --card: #111318;
      --text: #eaeef7;
      --muted: #a8b0c3;
      --border: #1b1f28;
      --shadow: rgba(0, 0, 0, 0.4);
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f7f9fc;
        --card: #ffffff;
        --text: #0b0c0f;
        --muted: #5a6272;
        --border: #e8ecf5;
        --shadow: rgba(8, 23, 53, 0.08);
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg);
      min-height: 100vh; display: grid; place-items: center; color: var(--text);
      font: 500 16px/1.4 system-ui, -apple-system, Segoe UI, Roboto, Inter, "Noto Sans", Arial;
    }
    .card {
      width: min(92vw, 420px);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 10px 30px var(--shadow);
      padding: 28px;
      display: grid;
      gap: 18px;
      text-align: center;
    }
    .logo {
      font-size: 40px;
    }
    h1 {
      margin: 0; font-size: 20px; font-weight: 800;
    }
    p {
      margin: 0; color: var(--muted); font-size: 14px;
    }
    .btn {
      display: inline-flex; align-items: center; gap: 10px;
      padding: 12px 16px; border-radius: 12px; border: 1px solid var(--border);
      background: #fff; color: #0b0c0f; font-weight: 700; cursor: pointer;
      text-decoration: none; user-select: none;
      transition: transform .06s ease, box-shadow .2s ease;
    }
    @media (prefers-color-scheme: dark) {
      .btn { background: #1b1f28; color: #eaeef7; }
    }
    .btn:hover { transform: translateY(-1px); }
    .foot {
      color: var(--muted);
      font-size: 12px;
      margin-top: 6px;
    }
  </style>

  <!-- Supabase import -->
  <script type="importmap">
    {
      "imports": {
        "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2"
      }
    }
  </script>
</head>
<body>
  <main class="card">
    <div class="logo">💬</div>
    <h1>Free & Complicated Messenger 😉✌️</h1>
    <p>Realtime Supabase chat • Google login</p>
    <button id="google-btn" class="btn">Sign in with Google</button>
    <div class="foot">made with ❤️☕️</div>
  </main>

  <script type="module">
    import { createClient } from '@supabase/supabase-js'

    // 🔹 Replace with YOUR project URL and anon public key
    const supabaseUrl = 'https://fzjkpppzwiuozvszbbdl.supabase.co'
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ6amtwcHB6d2l1b3p2c3piYmRsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTYzODEwOTAsImV4cCI6MjA3MTk1NzA5MH0.32p6IZZYDIhd1RtPX8NgOv-kPjI-YBl5wCX5ajNnarg'
    const supabase = createClient(supabaseUrl, supabaseKey)

    // If already logged in, skip to chat
    const { data: { session } } = await supabase.auth.getSession()
    if (session) {
      location.href = 'chat.html'
    }

    document.getElementById('google-btn').addEventListener('click', async () => {
      const redirectTo = new URL('chat.html', location.href).toString()
      const { error } = await supabase.auth.signInWithOAuth({
        provider: 'google',
        options: { redirectTo }
      })
      if (error) console.error('Login error:', error.message)
    })
  </script>
</body>
</html>
